name: deploy

# O pipeline faz o que vocÃª fez Ã  mÃ£o na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: matheus-nelvam
  PORTA: 23220

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker stop front api banco" || true
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker rm front api banco" || true

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker volume create pgdata" || true
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker network create dados --interna" || true
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker network create web" || true

      - name: Subir banco, API e front
        run: |
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker run postgres:17-alpine --name banco --network dados -v pgdata:/var/lib/postgresql/data -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }}"
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker run gr-atv2-api:1 --name api --network dados -e POSTGRES_HOST=gr-$SLUG-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }}"
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker network connect web api"
          ssh -i ~/.ssh/deploy gr-$SLUG@gr.lab.ayty.org "gr-docker run gr-atv2-front:1 --name front --network web -p $PORTA:80 -e API=gr-$SLUG-api -e DEPLOY_SHA=${{ github.sha }}"

      - name: Conferir que subiu
        run: |
          sleep 5
          curl --fail --retry 5 --retry-delay 3 http://gr.lab.ayty.org:$PORTA/api/pokemons

